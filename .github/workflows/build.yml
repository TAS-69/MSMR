name: Build MSMR

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :common:test :fabric:build :neoforge:build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: MSMR-1.21.1
          path: |
            fabric/build/libs/msmr-fabric-1.21.1-*.jar
            neoforge/build/libs/msmr-neoforge-1.21.1-*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
